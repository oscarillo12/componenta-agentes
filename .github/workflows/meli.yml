name: MeLi Publisher

on:
  schedule:
    - cron: '0 12 * * *'  # 1x/día UTC → 9am hora Chile
  workflow_dispatch:        # ejecutar manualmente desde GitHub Actions

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm install

      - name: Publicar productos pendientes en MercadoLibre
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_SECRET_KEY: ${{ secrets.ML_SECRET_KEY }}
        run: node agentes/meli.js
